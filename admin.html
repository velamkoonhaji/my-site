<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel — Elizabeth Olsen Fandom</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Times New Roman",Times,serif;font-weight:bold;background:#0a0b0e;color:#f3ede7;min-height:100vh}
  
  .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:40px;max-width:400px;width:100%;backdrop-filter:blur(18px);text-align:center}
  .login-box h1{font-size:1.8rem;margin-bottom:8px}
  .login-box p{color:#a79d93;margin-bottom:24px;font-size:.95rem}
  .login-box input{width:100%;padding:14px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#f3ede7;font-family:inherit;font-weight:bold;font-size:1rem;margin-bottom:16px;outline:none}
  .login-box input:focus{border-color:#e0483e}
  .login-box button{width:100%;padding:14px;border-radius:12px;border:none;background:#e0483e;color:#fff;font-family:inherit;font-weight:bold;font-size:1rem;cursor:pointer;transition:.2s}
  .login-box button:hover{background:#c43a32}
  .login-error{color:#ff6b6b;font-size:.85rem;margin-top:12px;display:none}

  .panel{display:none;max-width:1200px;margin:0 auto;padding:30px 20px}
  .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:16px}
  .panel-header h1{font-size:1.8rem}
  .panel-header h1 span{color:#e0483e}
  .panel-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:10px 20px;border-radius:100px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#f3ede7;font-family:inherit;font-weight:bold;cursor:pointer;transition:.2s;font-size:.9rem}
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn-danger{background:rgba(224,72,62,.2);border-color:rgba(224,72,62,.4);color:#ff8a80}
  .btn-danger:hover{background:rgba(224,72,62,.35)}
  .btn-success{background:rgba(72,224,72,.15);border-color:rgba(72,224,72,.3);color:#80ff8a}
  .btn-success:hover{background:rgba(72,224,72,.25)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px}
  .stat-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:20px;text-align:center}
  .stat-card .num{font-size:2.2rem;color:#e0483e}
  .stat-card .label{color:#a79d93;font-size:.85rem;margin-top:4px}

  .gallery-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .photo-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:16px;overflow:hidden;position:relative;transition:.3s}
  .photo-card.hidden-photo{opacity:.4;border-color:rgba(224,72,62,.4)}
  .photo-card img{width:100%;height:200px;object-fit:cover;display:block}
  .photo-card .info{padding:12px}
  .photo-card .date{font-size:.8rem;color:#a79d93}
  .photo-card .source{font-size:.7rem;color:#e0483e;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
  .photo-card .actions{position:absolute;top:10px;right:10px;display:flex;gap:6px}
  .photo-card .actions button{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;font-size:1rem;display:grid;place-items:center;transition:.2s}
  .btn-hide{background:rgba(224,72,62,.8);color:#fff}
  .btn-hide:hover{background:#e0483e;transform:scale(1.1)}
  .btn-show{background:rgba(72,224,72,.8);color:#fff}
  .btn-show:hover{background:#48e048;transform:scale(1.1)}
  .hidden-badge{position:absolute;top:10px;left:10px;background:rgba(224,72,62,.9);color:#fff;padding:4px 10px;border-radius:100px;font-size:.7rem}

  .toast{position:fixed;bottom:30px;right:30px;padding:14px 24px;border-radius:12px;background:rgba(72,224,72,.2);border:1px solid rgba(72,224,72,.4);color:#80ff8a;font-family:inherit;font-weight:bold;transform:translateY(100px);opacity:0;transition:.4s;z-index:999}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.error{background:rgba(224,72,62,.2);border-color:rgba(224,72,62,.4);color:#ff8a80}

  @media(max-width:600px){
    .gallery-admin{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
    .photo-card img{height:150px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 Admin Panel</h1>
    <p>Elizabeth Olsen Fandom Hub</p>
    <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="off">
    <button onclick="tryLogin()">Unlock Panel</button>
    <div class="login-error" id="loginError">Wrong password. Try again.</div>
  </div>
</div>

<!-- PANEL -->
<div class="panel" id="panel">
  <div class="panel-header">
    <h1>🎛️ Admin <span>Panel</span></h1>
    <div class="panel-actions">
      <button class="btn btn-success" onclick="restoreAll()">↩️ Restore All</button>
      <button class="btn" onclick="location.href='index.html'">← Back to Site</button>
      <button class="btn btn-danger" onclick="logout()"> Lock</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="totalCount">0</div><div class="label">Total Photos</div></div>
    <div class="stat-card"><div class="num" id="visibleCount">0</div><div class="label">Visible</div></div>
    <div class="stat-card"><div class="num" id="hiddenCount">0</div><div class="label">Hidden</div></div>
  </div>

  <div class="gallery-admin" id="adminGallery"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — رمز عبور رو اینجا عوض کن
   ========================================================= */
const ADMIN_PASSWORD = "Arman";  // ← رمز عبورت رو اینجا بذار

/* =========================================================
   BLACKLIST — لیست عکس‌های حذف‌شده
   ========================================================= */
function getBlacklist(){
  try { return JSON.parse(localStorage.getItem('eo:blacklist') || '[]'); }
  catch(e){ return []; }
}
function saveBlacklist(list){
  localStorage.setItem('eo:blacklist', JSON.stringify(list));
}
function isHidden(url){
  return getBlacklist().includes(url);
}
function hidePhoto(url){
  const list = getBlacklist();
  if (!list.includes(url)){ list.push(url); saveBlacklist(list); }
}
function showPhoto(url){
  const list = getBlacklist().filter(u => u !== url);
  saveBlacklist(list);
}

/* =========================================================
   LOGIN
   ========================================================= */
function tryLogin(){
  const pw = document.getElementById('passwordInput').value;
  if (pw === ADMIN_PASSWORD){
    sessionStorage.setItem('eo:admin', 'true');
    showPanel();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('passwordInput').value = '';
  }
}
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

function logout(){
  sessionStorage.removeItem('eo:admin');
  location.reload();
}

function showPanel(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadPhotos();
}

// اگه قبلاً لاگین کرده، مستقیم برو پنل
if (sessionStorage.getItem('eo:admin') === 'true'){
  showPanel();
}

/* =========================================================
   LOAD PHOTOS — از ویکی‌مدیا + TMDB
   ========================================================= */
async function loadPhotos(){
  const grid = document.getElementById('adminGallery');
  grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#a79d93;padding:40px">Loading photos...</p>';
  
  const images = [];
  
  // ویکی‌مدیا
  try {
    const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
      '&generator=search&gsrsearch=' + encodeURIComponent('Elizabeth Olsen') +
      '&gsrnamespace=6&gsrlimit=50' +
      '&prop=imageinfo&iiprop=url|timestamp|size&iiurlwidth=900';
    const r = await fetch(u);
    const j = await r.json();
    const pages = j.query && j.query.pages ? j.query.pages : {};
    Object.values(pages).forEach(p => {
      if (p.imageinfo && p.imageinfo[0]) {
        const ii = p.imageinfo[0];
        if (ii.thumbwidth > 200 && ii.thumburl) {
          images.push({
            url: ii.thumburl,
            date: new Date(ii.timestamp).getTime(),
            source: 'Wikimedia',
            title: p.title || ''
          });
        }
      }
    });
  } catch(e) { console.warn('Wikimedia failed:', e); }
  
  // TMDB
  const tmdbKey = "517a1ac518cdd0a99fc594a4f4e1d55f";
  if (tmdbKey) {
    try {
      const r = await fetch(`https://api.themoviedb.org/3/person/111367/images?api_key=${tmdbKey}&language=en-US`);
      if (r.ok) {
        const d = await r.json();
        (d.profiles || []).slice(0, 30).forEach((p, i) => {
          if (p && p.file_path) {
            images.push({
              url: `https://image.tmdb.org/t/p/w780${p.file_path}`,
              date: Date.now() - i * 86400000 * 3,
              source: 'TMDB',
              title: ''
            });
          }
        });
      }
    } catch(e) { console.warn('TMDB failed:', e); }
  }
  
  // مرتب‌سازی
  images.sort((a, b) => b.date - a.date);
  
  // حذف تکراری
  const unique = [];
  const seen = new Set();
  images.forEach(img => {
    if (!seen.has(img.url)){ seen.add(img.url); unique.push(img); }
  });
  
  renderAdmin(unique);
}

function renderAdmin(images){
  const grid = document.getElementById('adminGallery');
  const blacklist = getBlacklist();
  
  let visible = 0, hidden = 0;
  
  grid.innerHTML = images.map((img, i) => {
    const isHid = blacklist.includes(img.url);
    if (isHid) hidden++; else visible++;
    const dateStr = new Date(img.date).toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'});
    return `
      <div class="photo-card ${isHid ? 'hidden-photo' : ''}" id="card-${i}">
        ${isHid ? '<div class="hidden-badge">HIDDEN</div>' : ''}
        <div class="actions">
          <button class="${isHid ? 'btn-show' : 'btn-hide'}" 
                  onclick="togglePhoto('${esc(img.url)}', ${i})"
                  title="${isHid ? 'Show this photo' : 'Hide this photo'}">
            ${isHid ? '👁️' : '❌'}
          </button>
        </div>
        <img src="${esc(img.url)}" alt="" loading="lazy">
        <div class="info">
          <div class="date">${dateStr}</div>
          <div class="source">${img.source}</div>
        </div>
      </div>`;
  }).join('');
  
  document.getElementById('totalCount').textContent = images.length;
  document.getElementById('visibleCount').textContent = visible;
  document.getElementById('hiddenCount').textContent = hidden;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =========================================================
   ACTIONS
   ========================================================= */
function togglePhoto(url, index){
  if (isHidden(url)){
    showPhoto(url);
    showToast('Photo restored ✅');
  } else {
    hidePhoto(url);
    showToast('Photo hidden ❌');
  }
  // رفرش کارت
  const card = document.getElementById('card-' + index);
  if (card) {
    const nowHidden = isHidden(url);
    card.className = 'photo-card' + (nowHidden ? ' hidden-photo' : '');
    card.querySelector('.actions button').className = nowHidden ? 'btn-show' : 'btn-hide';
    card.querySelector('.actions button').textContent = nowHidden ? '👁️' : '❌';
    card.querySelector('.actions button').title = nowHidden ? 'Show this photo' : 'Hide this photo';
    if (nowHidden && !card.querySelector('.hidden-badge')){
      card.insertAdjacentHTML('afterbegin', '<div class="hidden-badge">HIDDEN</div>');
    } else if (!nowHidden) {
      const badge = card.querySelector('.hidden-badge');
      if (badge) badge.remove();
    }
  }
  // آپدیت آمار
  const bl = getBlacklist();
  const total = document.querySelectorAll('.photo-card').length;
  document.getElementById('hiddenCount').textContent = bl.length;
  document.getElementById('visibleCount').textContent = total - bl.length;
}

function restoreAll(){
  if (confirm('Restore all hidden photos?')){
    localStorage.removeItem('eo:blacklist');
    showToast('All photos restored ✅');
    loadPhotos();
  }
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}
</script>

</body>
</html>
